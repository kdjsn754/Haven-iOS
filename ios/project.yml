name: Haven
options:
  bundleIdPrefix: com.haven
  deploymentTarget:
    iOS: "17.0"
  projectFormat: xcode15_3
  createIntermediateGroups: true
targets:
  Haven:
    type: application
    platform: iOS
    sources:
      # Info.plist 由下面的 info: 生成并作为 INFOPLIST_FILE 使用，
      # 不能再当资源复制一遍，否则会报「Multiple commands produce …/Info.plist」。
      - path: Sources
        excludes:
          - Info.plist
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Haven
        CFBundleDevelopmentRegion: zh_CN
        CFBundleLocalizations:
          - zh-Hans
          - zh_CN
          - en
        CFBundleAllowMixedLocalizations: true
        # ⚠️ 不写这两行，XcodeGen 会用默认的 1.0 / 1 覆盖 settings 里的版本号。
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # 保存壁纸到「照片」：只写也要给这条中文说明，否则第一次请求授权直接崩。
        NSPhotoLibraryAddUsageDescription: 用于把壁纸保存到你的照片
        # 建 / 查找自建相簿 Haven 需要读权限。
        NSPhotoLibraryUsageDescription: 用于把壁纸保存到 Haven 相簿
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: com.haven.wallpapers
            CFBundleURLSchemes:
              - haven
    settings:
      base:
        # 显式写 PRODUCT_NAME，否则可能生成 Applications/.app 并报
        # 「Multiple commands produce」。
        PRODUCT_NAME: Haven
        PRODUCT_MODULE_NAME: Haven
        PRODUCT_BUNDLE_IDENTIFIER: com.haven.wallpapers
        MARKETING_VERSION: 1.0.4
        CURRENT_PROJECT_VERSION: 7
        SWIFT_VERSION: 5.9
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1"
        ALWAYS_SEARCH_USER_PATHS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  Haven:
    build:
      targets:
        Haven: all
    run:
      config: Debug
    archive:
      config: Release
